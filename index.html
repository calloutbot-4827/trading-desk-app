<!doctype html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grok Bot">

<title>Grok Bot</title>
<link rel="manifest" href="manifest.json">

</head>
<body>
<div id="app">
  <div id="offline" class="offline" hidden></div>
  <main id="screen" class="screen"></main>
  <section id="overlay" class="overlay" hidden></section>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="tab on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-tab="agents" class="tab"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.2"/><circle cx="16" cy="8" r="3.2"/><path d="M2 20c0-3.5 2.7-6 6-6s6 2.5 6 6M12 20c0-3.5 1.3-6 4-6s6 2.5 6 6"/></svg><span>Agents</span></button>
    <button data-tab="activity" class="tab"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></button>
    <button data-tab="account" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Account</span></button>
